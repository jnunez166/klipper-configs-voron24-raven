# This is a configuration for my initial DragonBurner (DB0)

[mcu DB0]
canbus_uuid: 2394f075ff26

[temperature_sensor DB0_temp]
sensor_type: temperature_mcu
sensor_mcu: DB0

[extruder0]
step_pin: DB0: PD0
dir_pin: DB0: PD1
enable_pin: !DB0: PD2
microsteps: 32
rotation_distance: 22.2816642
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: DB0: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: DB0: PA3
min_temp: 0
max_temp: 290
pressure_advance: 0.064
max_extrude_cross_section: 5
max_extrude_only_distance: 150
min_extrude_temp: 190
#control: watermark
#pressure_advance_smooth_time: 0.01

[tmc2209 extruder0]
uart_pin: DB0: PA15
run_current: 0.650
#interpolate: false
#sense_resistor: 0.110

[fan_generic DB0_partfan]
pin: DB0: PA0

[heater_fan DB0_hotend_fan]
pin: DB0: PA1
heater: extruder0
heater_temp: 50.0
#kick_start_time: 0.5

[tool DB0]
tool_number: 0
extruder: extruder0
fan: fan_generic DB0_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 28
params_park_y: 0
params_park_z: 200.0
params_close_y: 30.0
params_safe_y: 120.0
params_input_shaper_freq_x: 62.4
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_y: 88.6
params_input_shaper_type_y: 'mzv'

[tool_probe DB0]
pin: DB0:PB6
tool: 0
z_offset: 0
speed: 5.0
drop_first_result: True
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
  _TAP_PROBE_ACTIVATE HEATER=extruder0 TEMP=150

[adxl345 DB0]
cs_pin: DB0: PB12
spi_software_sclk_pin: DB0: PB10
spi_software_mosi_pin: DB0: PB11
spi_software_miso_pin: DB0: PB2
axes_map: x,z,y

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    175, 175, 20
#accel_per_hz: 100
#sweeping_accel: 400
#sweeping_period: 0

#[filament_switch_sensor filament_sensor_DB0]
#switch_pin: DB0:PC3
#pause_on_runout: FALSE
#runout_gcode:
#  M117 Runout sensor DB0 reports: Runout
#  SET_GCODE_VARIABLE MACRO=DB0 VARIABLE=filament_consumed VALUE=1
#insert_gcode:
#  M117 Runout sensor DB0 reports: Filament Detected
#  SET_GCODE_VARIABLE MACRO=DB0 VARIABLE=filament_consumed VALUE=0

[gcode_macro DB0]
variable_active: 0
variable_filament_consumed: 0
variable_hotend_fan_stop_count: 0 # counter for checking if hotend fan stalled
variable_hotend_fan_min_rpm: 1500 # minimum rpm the hotend can have before fan stall is triggered
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=DB0 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder0
    SELECT_TOOL T=0
  {% endif %}

[gcode_macro T0]
variable_realtool: "DB0"
variable_backuptool: "T1"
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
